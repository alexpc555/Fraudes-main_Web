<script data-purpose="button-interactions">
    // Simular pulsación táctil con feedback para todos los botones
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        // Feedback visual táctil
        btn.classList.add('ring-2', 'ring-brand-accent');
        setTimeout(() => {
          btn.classList.remove('ring-2', 'ring-brand-accent');
        }, 180);
      });
    });
